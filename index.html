<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адыгея: сохраняем вместе</title>
    <style>
        /* Сброс базовых отступов */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background-color: #050806; /* Темная подложка */
            color: #ffffff;
            overflow: hidden; /* Убираем скролл на главной */
        }

        /* Полупрозрачный фон с гифкой */
        .bg-flag {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Фон над подложкой */
            background: url('flag.gif') center/cover no-repeat;
            opacity: 0.35; /* Степень прозрачности (можно менять от 0.1 до 1.0) */
            pointer-events: none; /* Чтобы гифка не перехватывала клики */
        }

        /* Главный контейнер с контентом */
        .main-container {
            position: relative;
            z-index: 2; /* Контент поверх фона */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* Заголовок */
        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 50px;
            line-height: 1.3;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.9);
        }

        h1 span {
            display: block;
            font-size: 2.2rem;
            font-weight: 400;
        }

        /* Блок с кнопками навигации */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        /* Стили кнопок */
        .nav-btn {
            display: block;
            background-color: rgba(0, 65, 34, 0.7); /* Полупрозрачный темно-зеленый */
            color: #ffffff;
            text-decoration: none;
            padding: 20px 30px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background-color: rgba(0, 65, 34, 0.95);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
                margin-bottom: 30px;
            }
            h1 span {
                font-size: 1.5rem;
            }
            .nav-menu {
                max-width: 100%;
                padding: 0 10px;
            }
            .nav-btn {
                padding: 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Фон -->
    <div class="bg-flag"></div>

    <!-- Контент -->
    <div class="main-container">
        <h1>Адыгея:<br><span>сохраняем вместе</span></h1>
        
        <nav class="nav-menu">
            <a href="heritage.html" class="nav-btn">Наследие Адыгов</a>
            <a href="tours.html" class="nav-btn">Туры по Адыгее</a>
            <a href="khabze.html" class="nav-btn">Законы ХАБЗЭ</a>
            <a href="contacts.html" class="nav-btn">Контакты</a>
        </nav>
    </div>

</body>
</html>
